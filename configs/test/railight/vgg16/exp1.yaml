architecture: railight
backbone: vgg16
num_exp: exp1

weights: weights/railight/vgg16/exp1/best_model.pth

cuda: true
gpu_ids: 0
batch_size: 4

source_test_files:
  # - ./dataset/source_train.txt
  # - ./dataset/source_val.txt
  - ./dataset/source_test.txt

target_test_files:
  # - ./dataset/target_train.txt
  # - ./dataset/target_val.txt
  - ./dataset/target_test.txt

export_predicted_source_path: null
export_predicted_target_path: null
export_fp_fn_samples_path: null

nc: 3
names: ['crack', 'missing_items', 'broken_sleeper']


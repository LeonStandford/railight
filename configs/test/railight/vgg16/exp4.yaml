architecture: railight
backbone: vgg16
num_exp: exp4

weights: /mnt/HDD6/longpm/railway/data_exp2/railight/weights/railight/vgg16/exp4/best_model.pth

cuda: true
gpu_ids: 3,5,7
batch_size: 4

source_test_files:
  - /mnt/HDD6/longpm/railway/data_exp2/8/dataset/source_test.txt

target_test_files:
  - /mnt/HDD6/longpm/railway/data_exp2/8/dataset/target_test.txt

export_predicted_source_path: null
export_predicted_target_path: null
export_fp_fn_samples_path: null

nc: 8
names: ['fastener_1', 'critical_crack', 'fastener_2', 'sleeper_l', 'sleeper_r', 'missing_items', 'broken_sleeper', 'minor_crack']

charts_dir: /mnt/HDD6/longpm/railway/data_exp2/railight/charts
records_dir: /mnt/HDD6/longpm/railway/data_exp2/railight/records
log_dir: /mnt/HDD6/longpm/railway/data_exp2/railight/logs

viz_num_samples: 6

# Figures / analysis toggles
is_run_confusion_matrix: true    # confusion_matrix_source.png, confusion_matrix_target.png
is_run_samples_grid: true        # samples_day.png, samples_real_night.png (gradcam)
is_run_tsne_reflectance: true    # tsne_reflectance.png
is_run_domain_gap: true          # KL / cross-entropy stats in the metrics table

iou_thr: 0.5
score_thr_cm: 0.5
nms_iou_thr: 0.35

use_night_synthesis: image_processing
night_synthesis_seed: 43

da:
  da_align_enabled: false
  da_ia_enabled: false
  da_oa_enabled: false
  da_ia_levels: [0, 1, 2]
  da_oa_levels: [0, 1, 2]
  da_reduction: 2.0
  da_context_impl: pool
  da_max_tokens: 1024
  da_disc_hidden: 256
  da_disc_max_size: 80
  da_prototype_source: clip
  da_prototype_dim: 512
  da_prototype_learnable: false
  da_prototype_mask_present: false
  da_clip_model: openai/clip-vit-base-patch32

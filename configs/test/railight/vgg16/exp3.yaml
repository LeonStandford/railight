architecture: railight
backbone: vgg16
num_exp: exp3

weights: /mnt/HDD4/longpm/railight/weights/railight/vgg16/exp3/best_model.pth

cuda: true
gpu_ids: 4
batch_size: 32

source_test_files: 
  # - /mnt/HDD4/longpm/railway/8/dataset/source_train.txt
  # - /mnt/HDD4/longpm/railway/8/dataset/source_val.txt
  - /mnt/HDD4/longpm/railway/8/dataset/source_test.txt

target_test_files:
  # - /mnt/HDD4/longpm/railway/8/dataset/target_train.txt
  # - /mnt/HDD4/longpm/railway/8/dataset/target_val.txt
  - /mnt/HDD4/longpm/railway/8/dataset/target_test.txt

export_predicted_source_path: null
export_predicted_target_path: null
export_fp_fn_samples_path: null

nc: 8
names: ['fastener_1', 'critical_crack', 'fastener_2', 'sleeper_l', 'sleeper_r', 'missing_items', 'broken_sleeper', 'minor_crack']

charts_dir:  /mnt/HDD4/longpm/railight/charts/
records_dir: /mnt/HDD4/longpm/railight/records/
log_dir: /mnt/HDD4/longpm/railight/logs

viz_num_samples: 6

is_run_confusion_matrix: true    
is_run_samples_grid: true        
is_run_tsne_reflectance: true   
is_run_domain_gap: true          

iou_thr: 0.5
score_thr_cm: 0.5
nms_iou_thr: 0.35

letterbox: true
scale_jitter: 0.0
input_size: 640
eval_class_aware: true
flip_label_swap: [[4, 5], [5, 4]]
box_loss: ciou

use_night_synthesis: dark_isp
night_synthesis_seed: 43

da:
  da_align_enabled: false
  da_ia_enabled: false
  da_oa_enabled: false
  da_ia_levels: [0, 1, 2]
  da_oa_levels: [0, 1, 2]
  da_reduction: 2.0
  da_context_impl: pool
  da_max_tokens: 1024
  da_disc_hidden: 256
  da_disc_max_size: 80
  da_prototype_source: clip
  da_prototype_dim: 512
  da_prototype_learnable: false
  da_prototype_mask_present: false
  da_clip_model: openai/clip-vit-base-patch32

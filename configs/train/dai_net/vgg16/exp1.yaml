architecture: dai_net
num_exp: exp1

batch_size: 2

lr: 5.0e-4
momentum: 0.9
weight_decay: 5.0e-4
gamma: 0.1             # LR decay multiplier applied at each lr_steps milestone

# Training schedule (override data/config.py defaults)
epochs:    100
max_steps: 340000      # ≈ 100 epochs; early-stop iteration count
lr_steps:  [170000, 250000, 310000]   # ≈ epoch 50 / 74 / 92

cuda: true
gpu_ids: 0
num_workers: 2
local_rank: 0          

source_train_file: ./dataset/source_train.txt
source_val_file:   ./dataset/source_val.txt
source_test_file:  ./dataset/source_test.txt
target_train_file: ./dataset/target_train.txt
target_val_file:   ./dataset/target_val.txt
target_test_file:  ./dataset/target_test.txt
target_folder4unsupervised: null
nc: 3
names: ['crack', 'missing_items', 'broken_sleeper']

save_folder: weights/
charts_dir:  ./charts
resume: false

viz_num_samples: 6
viz_every_iters: 500
viz_full_every_epochs: 1

kl_loss_weight: 1.0
target_loss_weight: 0.05
target_sup_loss_weight: 1.0

box_loss: smooth_l1

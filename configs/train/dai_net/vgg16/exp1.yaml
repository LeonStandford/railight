architecture: dai_net
num_exp: exp1

batch_size: 2

lr: 5.0e-4
momentum: 0.9
weight_decay: 5.0e-4
gamma: 0.1             # LR decay multiplier applied at each lr_steps milestone

# Training schedule (override data/config.py defaults)
epochs:    100
max_steps: 340000      # ≈ 100 epochs; early-stop iteration count
lr_steps:  [170000, 250000, 310000]   # ≈ epoch 50 / 74 / 92

cuda: true
gpu_ids: 0
num_workers: 2
local_rank: 0          

train_file: ./dataset/source_train.txt
val_file:   ./dataset/source_val.txt
nc: 3
source_folder: /mnt/Nhan/data/images/source
target_folder: /mnt/Nhan/data/images/target

save_folder: weights/
charts_dir:  ./charts
resume: false

viz_num_samples: 6
viz_every_iters: 500
viz_full_every_epochs: 1

# UDA: cross-domain KL on backbone features (source vs target). Set to 0
# to disable and fall back to source-only training without alignment.
kl_loss_weight: 1.0
# Extra unsupervised Retinex reconstruction loss on target images via net_enh.
# Independent of kl_loss_weight; set to 0 to disable.
target_loss_weight: 0.05


# smooth_l1 (default) | ciou | wiou_v1 | wiou_v3
box_loss: smooth_l1

architecture: dai_net
num_exp: exp1

batch_size: 2

lr: 5.0e-4
momentum: 0.9
weight_decay: 5.0e-4
gamma: 0.1             # LR decay multiplier applied at each lr_steps milestone

# Training schedule (override data/config.py defaults)
# ~3385 iter/epoch at batch_size=2. Old lr_steps [20k,25k,30k] decayed lr
# to ~0 by epoch ~9, freezing the model (train+val plateaued early).
# Push milestones much later so the model keeps learning.
epochs:    100
max_steps: 340000      # ≈ 100 epochs; early-stop iteration count
lr_steps:  [170000, 250000, 310000]   # ≈ epoch 50 / 74 / 92

cuda: true
multigpu: true
num_workers: 2
local_rank: 0          

train_file: ./dataset/source_train.txt
val_file:   ./dataset/source_val.txt
nc: 3
source_folder: /home/caotulab/wd_nhan/data/images/3/source
target_folder: /home/caotulab/wd_nhan/data/images/3/target

save_folder: weights/
charts_dir:  ./charts
# resume: false      → fresh run
# resume: true       → auto-load <save_folder>/<architecture>/<backbone>/last_model.pth
# resume: /some/path → explicit checkpoint
resume: false

viz_num_samples: 6
viz_every_iters: 500
viz_full_every_epochs: 1

# UDA: cross-domain KL on backbone features (source vs target). Set to 0
# to disable and fall back to source-only training without alignment.
kl_loss_weight: 1.0
# Extra unsupervised Retinex reconstruction loss on target images via net_enh.
# Independent of kl_loss_weight; set to 0 to disable.
target_loss_weight: 0.05

# 3C-GAN regularizers (arXiv: UDA without source data)
# wReg: anchor VGG backbone to pretrained weights (anti-overfit). 0 disables.
wreg_loss_weight: 1.0e-4
# entropy: minimize entropy of target detection confidence (sharper boundary).
entropy_loss_weight: 0.01

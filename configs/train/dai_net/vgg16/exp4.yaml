architecture: dai_net
num_exp: exp4

batch_size: 2

lr: 5.0e-4
momentum: 0.9
weight_decay: 5.0e-4
gamma: 0.1
epochs: 100
max_steps: 340000
lr_steps: [170000, 250000, 310000]

cuda: true
gpu_ids: 5,6,7
num_workers: 2
local_rank: 0

source_train_file: ./dataset/source_train.txt
source_val_file:   ./dataset/source_val.txt
source_test_file:  ./dataset/source_test.txt
target_train_file: ./dataset/target_train.txt
target_val_file:   ./dataset/target_val.txt
target_test_file:  ./dataset/target_test.txt
target_folder4unsupervised: null

nc: 8
names: ['fastener_1', 'critical_crack', 'fastener_2', 'sleeper_l', 'sleeper_r', 'missing_items', 'broken_sleeper', 'minor_crack']

save_folder: weights/
charts_dir:  ./charts
records_dir: ./records
resume: true

viz_num_samples: 6
viz_every_iters: 500
viz_full_every_epochs: 1

kl_loss_weight: 1.0
target_loss_weight: 0.1
is_use_supervised_target_loss: false
supervised_target_loss_weight: 1.0

focal_enabled: true
focal_gamma: 2.0
focal_alpha_bg: 0.25

box_loss: smooth_l1
is_use_rc_loss: true

architecture: dai_net
num_exp: exp2

batch_size: 2

lr: 5.0e-4
momentum: 0.9
weight_decay: 5.0e-4
gamma: 0.1            
epochs: 100
max_steps: 340000
lr_steps:  [170000, 250000, 310000]

cuda: true
gpu_ids: 0
num_workers: 2
local_rank: 0

source_train_file: ./dataset/source_train.txt
source_val_file:   ./dataset/source_val.txt
source_test_file:  ./dataset/source_test.txt
target_train_file: ./dataset/target_train.txt
target_val_file:   ./dataset/target_val.txt
target_test_file:  ./dataset/target_test.txt
target_folder4unsupervised: null
nc: 3
names: ['crack', 'missing_items', 'broken_sleeper']

save_folder: weights/
charts_dir:  ./charts
resume: true

viz_num_samples: 6
viz_every_iters: 500
viz_full_every_epochs: 1

kl_loss_weight: 1.0
target_loss_weight: 0.1

box_loss: wiou_v3

# Redecomposition cohering loss (L_rc, Eq.2 DAI-Net); set false to disable
is_use_rc_loss: true

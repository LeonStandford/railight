# -------- identity ----------------------------------------------------
architecture:                  railight
backbone:                      vgg16
num_exp:                       exp1

# -------- batch / optimiser -------------------------------------------
batch_size:                    2
nominal_batch_size:            0  # 0 = no effective-batch LR scaling
lr_scale_by_effective_batch:   false
lr:                            0.0005
momentum:                      0.9
weight_decay:                  0.0005
gamma:                         0.1
optimizer:                     sgd
muon_ratio:                    0.5

# -------- lr schedule -------------------------------------------------
epochs:                        100
max_steps:                     340000
lr_steps:                      [170000, 250000, 310000]
lr_schedule:                   step
warmup_epochs:                 0.0
warmup_iters:                  0
lr_final_ratio:                0.01
prog_warmup_iters:             0

# -------- runtime / throughput ----------------------------------------
cuda:                          true
gpu_ids:                       0
num_workers:                   2
local_rank:                    0
seed:                          42
amp:                           false  # false | fp16 | bf16
match_on_device:               true
loader_persistent_workers:     true
loader_prefetch_factor:        4
profile:                       false

# -------- dataset -----------------------------------------------------
source_train_file:             ./dataset/source_train.txt
source_val_file:               ./dataset/source_val.txt
source_test_file:              ./dataset/source_test.txt
target_train_file:             ./dataset/target_train.txt
target_val_file:               ./dataset/target_val.txt
target_test_file:              ./dataset/target_test.txt
nc:                            3
names:                         [crack, missing_items, broken_sleeper]

# -------- outputs -----------------------------------------------------
save_folder:                   weights/
charts_dir:                    ./charts
records_dir:                   ./records
log_dir:                       ./logs
resume:                        false

# -------- validation / visualisation ----------------------------------
val_every_epochs:              1
viz_num_samples:               6
viz_full_every_epochs:         1
viz_max_source_batches:        30
viz_max_target_batches:        30
eval_class_aware:              true
model_selection:               micro_f1

# -------- input pipeline / augmentation -------------------------------
augmentation:                  railight  # railight = distort + random crop + mosaic/jitter + offline bank; fcos = hflip only
data_pipeline:                 transforms  # transforms | legacy
target_use_transforms:         true
input_size:                    640
letterbox:                     false
scale_jitter:                  0.0
mosaic_prob:                   0.0
flip_label_swap:               null  # nc=3 has no left/right rail pair to remap on a horizontal flip
offline_aug_dir:               /mnt/HDD6/longpm/railway/data_exp2/8/dataset/strong_aug_images  # null = no offline strong-augmented bank (ignored when augmentation=fcos)
offline_aug_mode:              crop
use_night_synthesis:           dark_isp
night_synthesis_seed:          null

# -------- model / weights / EMA ---------------------------------------
backbone_weights:              auto
backbone_scale:                null
pretrained_model:              null
vgg_fixed_layers:              0  # 0 = train the whole backbone
ema_enabled:                   false
ema_decay:                     0.9999
ema_warmup_iters:              2000

# -------- detection losses --------------------------------------------
loss_preset:                   full  # full | detection_only (detection_only zeroes every DA term)
box_loss:                      smooth_l1
overlap_thresh:                null  # null keeps cfg.FACE.OVERLAP_THRESH (0.35)
focal_enabled:                 true
focal_gamma:                   2.0
focal_alpha_bg:                0.25
focal_alpha_include_target:    false
focal_class_weights:           null
stal_enabled:                  false
stal_ref_area:                 0.02
stal_max_w:                    4.0

# -------- domain-adaptation losses ------------------------------------
kl_loss_weight:                1.0
kl_loss_max:                   50.0  # clamp on the KL term
target_loss_weight:            0.05
is_use_supervised_target_loss: false
supervised_target_loss_weight: 1.0
is_use_rc_loss:                true
wreg_loss_weight:              0.0001
entropy_loss_weight:           0.01
align_adv_weight:              null  # null = adversarial alignment head off
align_lambda_gamma:            0.0
align_disc_lr_mult:            1.0

# -------- wandb -------------------------------------------------------
use_wandb:                     false
wandb_project:                 railight-railway
wandb_entity:                  null
wandb_dir:                     /mnt/HDD6/longpm/railway/data_exp2/railight/wandb

# -------- DAMamba / adversarial DA heads -----------------------------
da:
  da_align_enabled:          false
  da_ia_enabled:             true
  da_oa_enabled:             true
  da_ia_levels:              [0, 1, 2]
  da_oa_levels:              [0, 1, 2]
  da_img_adv_weight:         1.0
  da_obj_adv_weight:         0.5
  da_grl_gamma:              10.0
  da_fg_topk_frac:           0.25
  da_reduction:              2.0
  da_context_impl:           pool
  da_max_tokens:             1024
  da_disc_hidden:            256
  da_disc_max_size:          80
  da_prototype_source:       clip
  da_prototype_dim:          512
  da_prototype_learnable:    false
  da_prototype_mask_present: false
  da_clip_model:             openai/clip-vit-base-patch32

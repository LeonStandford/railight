# -------- identity ----------------------------------------------------
architecture:                  railight
backbone:                      vgg16
num_exp:                       exp3_da_batch16_strong_augmetation_h100

# -------- batch / optimiser -------------------------------------------
batch_size:                    16
nominal_batch_size:            16  # 0 = no effective-batch LR scaling
lr_scale_by_effective_batch:   false
lr:                            0.0005
momentum:                      0.9
weight_decay:                  0.0005
gamma:                         0.1
optimizer:                     sgd
muon_ratio:                    0.5

# -------- lr schedule -------------------------------------------------
epochs:                        100
max_steps:                     340000
lr_steps:                      [98000, 130000, 150000]
lr_schedule:                   cosine
warmup_epochs:                 3.0
warmup_iters:                  0
lr_final_ratio:                0.01
prog_warmup_iters:             0

# -------- runtime / throughput ----------------------------------------
cuda:                          true
gpu_ids:                       0
num_workers:                   4
local_rank:                    0
seed:                          42
amp:                           false  # false | fp16 | bf16
match_on_device:               true
loader_persistent_workers:     true
loader_prefetch_factor:        4
profile:                       false

# -------- dataset -----------------------------------------------------
source_train_file:             /local/stacy.en14/data/railway/8/dataset/source_train.txt
source_val_file:               /local/stacy.en14/data/railway/8/dataset/source_val.txt
source_test_file:              /local/stacy.en14/data/railway/8/dataset/source_test.txt
target_train_file:             /local/stacy.en14/data/railway/8/dataset/target_train.txt
target_val_file:               /local/stacy.en14/data/railway/8/dataset/target_val.txt
target_test_file:              /local/stacy.en14/data/railway/8/dataset/target_test.txt
nc:                            8
names:                         [fastener_1, critical_crack, fastener_2, sleeper_l, sleeper_r, missing_items, broken_sleeper, minor_crack]

# -------- outputs -----------------------------------------------------
save_folder:                   /local/stacy.en14/models/railight/weights/
charts_dir:                    /local/stacy.en14/models/railight/charts/
records_dir:                   /local/stacy.en14/models/railight/records/
log_dir:                       /local/stacy.en14/models/railight/logs
resume:                        true

# -------- validation / visualisation ----------------------------------
val_every_epochs:              3
viz_num_samples:               6
viz_full_every_epochs:         30
viz_max_source_batches:        30
viz_max_target_batches:        30
eval_class_aware:              true
model_selection:               macro_f1

# -------- input pipeline / augmentation -------------------------------
augmentation:                  railight  # railight = distort + random crop + mosaic/jitter + offline bank; fcos = hflip only
data_pipeline:                 transforms  # transforms | legacy
target_use_transforms:         true
input_size:                    640
letterbox:                     false
scale_jitter:                  0
mosaic_prob:                   0
flip_label_swap:               [[4, 5], [5, 4]]
offline_aug_dir:               /local/stacy.en14/data/railway/8/dataset/strong_aug_images  # null = no offline strong-augmented bank (ignored when augmentation=fcos)
offline_aug_mode:              crop
use_night_synthesis:           dark_isp
night_synthesis_seed:          null

# -------- model / weights / EMA ---------------------------------------
backbone_weights:              auto
backbone_scale:                null
pretrained_model:              null
vgg_fixed_layers:              0  # 0 = train the whole backbone
ema_enabled:                   true
ema_decay:                     0.9999
ema_warmup_iters:              2000

# -------- detection losses --------------------------------------------
loss_preset:                   full  # full | detection_only (detection_only zeroes every DA term)
box_loss:                      ciou
overlap_thresh:                null  # null keeps cfg.FACE.OVERLAP_THRESH (0.35)
focal_enabled:                 true
focal_gamma:                   2.0
focal_alpha_bg:                0.25
focal_alpha_include_target:    true
focal_class_weights:           null
stal_enabled:                  false
stal_ref_area:                 0.02
stal_max_w:                    4.0

# -------- domain-adaptation losses ------------------------------------
kl_loss_weight:                0.05
kl_loss_max:                   50.0  # clamp on the KL term
target_loss_weight:            0.1
is_use_supervised_target_loss: true
supervised_target_loss_weight: 1.0
is_use_rc_loss:                false
wreg_loss_weight:              0.0001
entropy_loss_weight:           0.01
align_adv_weight:              null  # null = adversarial alignment head off
align_lambda_gamma:            0.0
align_disc_lr_mult:            1.0

# -------- wandb -------------------------------------------------------
use_wandb:                     true
wandb_project:                 da-rdd-railight/exp3_da_batch16_strong_augmetation_h100
wandb_entity:                  null
wandb_dir:                     /local/stacy.en14/models/railight/wandb

# -------- DAMamba / adversarial DA heads -----------------------------
da:
  da_align_enabled:          false
  da_ia_enabled:             false
  da_oa_enabled:             false
  da_ia_levels:              [0, 1, 2]
  da_oa_levels:              [0, 1, 2]
  da_img_adv_weight:         1.0
  da_obj_adv_weight:         0.5
  da_grl_gamma:              10.0
  da_fg_topk_frac:           0.25
  da_reduction:              2.0
  da_context_impl:           pool
  da_max_tokens:             1024
  da_disc_hidden:            256
  da_disc_max_size:          80
  da_prototype_source:       clip
  da_prototype_dim:          512
  da_prototype_learnable:    false
  da_prototype_mask_present: false
  da_clip_model:             openai/clip-vit-base-patch32

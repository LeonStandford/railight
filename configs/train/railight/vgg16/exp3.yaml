architecture: railight
backbone: vgg16
num_exp: exp3

batch_size: 2

lr: 5.0e-4
momentum: 0.9
weight_decay: 5.0e-4
gamma: 0.1
epochs: 100
max_steps: 340000
lr_steps: [170000, 250000, 310000]

cuda: true
gpu_ids: 5,7
num_workers: 2
local_rank: 0

source_train_file: /mnt/HDD6/longpm/railway/data_exp2/8/dataset/source_train.txt
source_val_file:   /mnt/HDD6/longpm/railway/data_exp2/8/dataset/source_val.txt
source_test_file:  /mnt/HDD6/longpm/railway/data_exp2/8/dataset/source_test.txt
target_train_file: /mnt/HDD6/longpm/railway/data_exp2/8/dataset/target_train.txt
target_val_file:   /mnt/HDD6/longpm/railway/data_exp2/8/dataset/target_val.txt
target_test_file:  /mnt/HDD6/longpm/railway/data_exp2/8/dataset/target_test.txt
target_folder4unsupervised: null

nc: 8
names: ['fastener_1', 'critical_crack', 'fastener_2', 'sleeper_l', 'sleeper_r', 'missing_items', 'broken_sleeper', 'minor_crack']

save_folder: /mnt/HDD6/longpm/railway/data_exp2/railight/weights/
charts_dir:  /mnt/HDD6/longpm/railway/data_exp2/railight/charts/
records_dir: /mnt/HDD6/longpm/railway/data_exp2/railight/records/
log_dir: /mnt/HDD6/longpm/railway/data_exp2/railight/logs
resume: true

val_every_epochs: 3
viz_num_samples: 6
viz_every_iters: 500
viz_full_every_epochs: 10
viz_max_source_batches: 30
viz_max_target_batches: 30

kl_loss_weight: 1.0
target_loss_weight: 0.1
is_use_supervised_target_loss: true
supervised_target_loss_weight: 1.0

focal_enabled: true
focal_gamma: 2.0
focal_alpha_bg: 0.25

box_loss: smooth_l1
is_use_rc_loss: false

use_wandb: true
wandb_project: da-rdd-railight
wandb_dir: /mnt/HDD6/longpm/railway/data_exp2/railight/wandb
wandb_dir: /mnt/HDD6/longpm/railway/data_exp2/railight/wandb

# defaults made explicit for cross-config consistency
wreg_loss_weight: 0.0001
entropy_loss_weight: 0.01
optimizer: sgd
muon_ratio: 0.5
prog_warmup_iters: 0
stal_enabled: false
stal_ref_area: 0.02
stal_max_w: 4.0
mutual_loss_weight: 0.0
pseudo_weight: 0.0
pseudo_conf: 0.7
pseudo_start_iters: 0
pseudo_nms_iou: 0.35
ema_decay: 0.9996
pseudo_strong_aug: true
pseudo_ramp_iters: 1000
pseudo_cls_weight: 0.25
focal_class_weights: null
backbone_scale: null
backbone_weights: auto
pretrained_model: null
wandb_entity: null

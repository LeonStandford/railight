architecture: railight
backbone: yolo26n
num_exp: exp2

pretrained_model: weights/yolo26n.pt

batch_size: 4

lr: 5.0e-4
momentum: 0.9
weight_decay: 1e-6
gamma: 0.1
epochs: 1
max_steps: 340000
lr_steps: [170000, 250000, 310000]
optimizer: muon
muon_ratio: 0.5
prog_warmup_iters: 8000
stal_enabled: true
stal_ref_area: 0.02
stal_max_w: 4.0

cuda: true
gpu_ids: 5,7
num_workers: 2
local_rank: 0

source_train_file: ./dataset/source_train.txt
source_val_file:   ./dataset/source_val.txt
source_test_file:  ./dataset/source_test.txt
target_train_file: ./dataset/target_train.txt
target_val_file:   ./dataset/target_val.txt
target_test_file:  ./dataset/target_test.txt
target_folder4unsupervised: null

nc: 8
names: ['fastener_1', 'critical_crack', 'fastener_2', 'sleeper_l', 'sleeper_r', 'missing_items', 'broken_sleeper', 'minor_crack']

kl_loss_weight: 1.0
target_loss_weight: 0.1
is_use_supervised_target_loss: false
supervised_target_loss_weight: 1.0
mutual_loss_weight: 0.5

pseudo_weight: 0.4         # gentle: pseudo was collapsing target recall at weight 1.0
pseudo_conf: 0.7           # teacher confidence floor (lower = more, less-sparse pseudo GT)
pseudo_cls_weight: 0.25    # down-weight pseudo classification loss (avoids "all background")
pseudo_start_iters: 15000  # burn-in: student trains supervised-only until here
pseudo_nms_iou: 0.5
ema_decay: 0.9996          # teacher = 0.9996*teacher + 0.0004*student per step
pseudo_strong_aug: true    # student sees photometric-jittered target
pseudo_ramp_iters: 2000    # ease the pseudo loss in over 2000 iters after burn-in

focal_enabled: true
focal_gamma: 2.0
focal_alpha_bg: 0.25
focal_class_weights:
  fastener_1: 2.0
  critical_crack: 2.5
  fastener_2: 1.5
  sleeper_r: 2.5
  missing_items: 1.3
  broken_sleeper: 2.5
  minor_crack: 2.0

box_loss: smooth_l1
is_use_rc_loss: false

use_wandb: true
wandb_project: uda-rdd-idayolo
wandb_dir: /mnt/HDD6/longpm/railway/data_exp2/railight/wandb
wandb_dir: /mnt/HDD6/longpm/railway/data_exp2/railight/wandb

save_folder: weights/
charts_dir:  ./charts
records_dir: ./records
log_dir: ./logs
resume: true

val_every_epochs: 3
viz_num_samples: 6
viz_every_iters: 500
viz_full_every_epochs: 10
viz_max_source_batches: 30
viz_max_target_batches: 30

# defaults made explicit for cross-config consistency
wreg_loss_weight: 0.0001
entropy_loss_weight: 0.01
backbone_scale: null
backbone_weights: auto
wandb_entity: null

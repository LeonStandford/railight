architecture: railight
backbone: yolo26n
num_exp: exp2

pretrained_model: weights/yolo26n.pt

batch_size: 4

lr: 5.0e-4
momentum: 0.9
weight_decay: 1e-6
gamma: 0.1
epochs: 1
max_steps: 340000
lr_steps: [170000, 250000, 310000]
optimizer: muon
muon_ratio: 0.5
prog_warmup_iters: 8000
stal_enabled: true
stal_ref_area: 0.02
stal_max_w: 4.0

cuda: true
gpu_ids: 5,7
num_workers: 2
local_rank: 0

source_train_file: ./dataset/source_train.txt
source_val_file:   ./dataset/source_val.txt
source_test_file:  ./dataset/source_test.txt
target_train_file: ./dataset/target_train.txt
target_val_file:   ./dataset/target_val.txt
target_test_file:  ./dataset/target_test.txt

nc: 8
names: ['fastener_1', 'critical_crack', 'fastener_2', 'sleeper_l', 'sleeper_r', 'missing_items', 'broken_sleeper', 'minor_crack']

kl_loss_weight: 1.0
target_loss_weight: 0.1
is_use_supervised_target_loss: false
supervised_target_loss_weight: 1.0

focal_enabled: true
focal_gamma: 2.0
focal_alpha_bg: 0.25
focal_class_weights:
  fastener_1: 2.0
  critical_crack: 2.5
  fastener_2: 1.5
  sleeper_r: 2.5
  missing_items: 1.3
  broken_sleeper: 2.5
  minor_crack: 2.0

box_loss: smooth_l1
is_use_rc_loss: false

use_wandb: true
wandb_project: uda-rdd-idayolo
wandb_dir: /mnt/HDD6/longpm/railway/data_exp2/railight/wandb
wandb_dir: /mnt/HDD6/longpm/railway/data_exp2/railight/wandb

save_folder: weights/
charts_dir:  ./charts
records_dir: ./records
log_dir: ./logs
resume: true

val_every_epochs: 3
viz_num_samples: 6
viz_full_every_epochs: 10
viz_max_source_batches: 30
viz_max_target_batches: 30

# defaults made explicit for cross-config consistency
wreg_loss_weight: 0.0001
entropy_loss_weight: 0.01
backbone_scale: null
backbone_weights: auto
wandb_entity: null

use_night_synthesis: dark_isp
night_synthesis_seed: null

da:
  da_align_enabled: false
  da_ia_enabled: true
  da_oa_enabled: true
  da_ia_levels: [0, 1, 2]
  da_oa_levels: [0, 1, 2]
  da_img_adv_weight: 1.0
  da_obj_adv_weight: 0.5
  da_grl_gamma: 10.0
  da_fg_topk_frac: 0.25
  da_reduction: 2.0
  da_context_impl: pool
  da_max_tokens: 1024
  da_disc_hidden: 256
  da_disc_max_size: 80
  da_prototype_source: clip
  da_prototype_dim: 512
  da_prototype_learnable: false
  da_prototype_mask_present: false
  da_clip_model: openai/clip-vit-base-patch32

offline_aug_dir: ./dataset/strong_aug_images
offline_aug_mode: crop
